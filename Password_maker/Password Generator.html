<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found" i]) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <title>Password Generator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Schibsted+Grotesk:wght@400;500;700&display=swap"
    />
    <style>
      /* Layout: one centered tool column. Output panel on top, criteria below, strength read-out between. */
      :root {
        --bg: #edf0f4;
        --surface: #ffffff;
        --surface-2: #f4f6f9;
        --fg: #14202b;
        --muted: #5a6b7b;
        --line: #d6dde5;
        --accent: #0d6e5f;
        --accent-fg: #ffffff;
        --digit: #b4531a;
        --symbol: #3a56c4;
        --weak: #c23a3a;
        --fair: #c7831a;
        --good: #5b8a1f;
        --strong: #0d6e5f;
        --font-body:
          "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
        --font-mono:
          "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas,
          monospace;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0e151b;
          --surface: #16202a;
          --surface-2: #1d2935;
          --fg: #e6edf3;
          --muted: #93a3b3;
          --line: #2a3846;
          --accent: #4fd1b0;
          --accent-fg: #07211b;
          --digit: #f0a35e;
          --symbol: #8fa8ff;
          --weak: #ef7676;
          --fair: #e8a94a;
          --good: #9cc95a;
          --strong: #4fd1b0;
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0e151b;
        --surface: #16202a;
        --surface-2: #1d2935;
        --fg: #e6edf3;
        --muted: #93a3b3;
        --line: #2a3846;
        --accent: #4fd1b0;
        --accent-fg: #07211b;
        --digit: #f0a35e;
        --symbol: #8fa8ff;
        --weak: #ef7676;
        --fair: #e8a94a;
        --good: #9cc95a;
        --strong: #4fd1b0;
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font-body);
        font-size: 16px;
        line-height: 1.5;
        padding-inline: 16px;
        padding-block: 32px 48px;
      }
      main {
        max-width: 640px;
        margin-inline: auto;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      h1 {
        font-size: 1.5rem;
        line-height: 1.2;
        margin: 0;
        letter-spacing: -0.01em;
        text-wrap: balance;
      }
      .lede {
        margin: 4px 0 0;
        color: var(--muted);
        font-size: 0.95rem;
      }

      .panel {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 20px;
      }

      .output {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .pw {
        font-family: var(--font-mono);
        font-weight: 500;
        font-size: clamp(1.15rem, 4.6vw, 1.6rem);
        line-height: 1.45;
        letter-spacing: 0.02em;
        word-break: break-all;
        min-height: 3em;
        padding: 14px 16px;
        background: var(--surface-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        user-select: all;
        min-width: 0;
      }
      .pw .d {
        color: var(--digit);
      }
      .pw .s {
        color: var(--symbol);
      }
      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      button {
        font: inherit;
        font-weight: 700;
        min-height: 44px;
        padding: 0 18px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--fg);
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
        flex: 1 1 140px;
      }
      button.secondary {
        flex: 1 1 140px;
      }
      button:hover {
        filter: brightness(0.96);
      }
      button:focus-visible,
      input:focus-visible {
        outline: 3px solid var(--symbol);
        outline-offset: 2px;
      }

      .strength {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .strength-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
      }
      .strength-label {
        font-weight: 700;
      }
      .strength-meta {
        font-family: var(--font-mono);
        font-size: 0.85rem;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      .bars {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .bars span {
        height: 8px;
        border-radius: 4px;
        background: var(--line);
      }
      .bars span.on {
        background: var(--level, var(--accent));
      }

      fieldset {
        border: 0;
        margin: 0;
        padding: 0;
        min-width: 0;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }
      .len-label {
        font-weight: 700;
      }
      .len-value {
        font-family: var(--font-mono);
        font-weight: 700;
        font-size: 1.25rem;
        font-variant-numeric: tabular-nums;
      }
      input[type="range"] {
        width: 100%;
        margin: 12px 0 0;
        accent-color: var(--accent);
        height: 28px;
      }

      .group-title {
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
        font-weight: 700;
        margin: 0 0 8px;
      }
      .opts {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }
      @media (max-width: 460px) {
        .opts {
          grid-template-columns: 1fr;
        }
      }
      .opt {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        min-height: 48px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--surface-2);
        cursor: pointer;
        min-width: 0;
      }
      .opt input {
        width: 20px;
        height: 20px;
        accent-color: var(--accent);
        flex: none;
        margin: 0;
      }
      .opt .t {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .opt .name {
        font-weight: 500;
        line-height: 1.25;
      }
      .opt .eg {
        font-family: var(--font-mono);
        font-size: 0.78rem;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .divider {
        height: 1px;
        background: var(--line);
        border: 0;
        margin: 20px 0;
      }
      .note {
        margin: 0;
        color: var(--muted);
        font-size: 0.85rem;
      }
      .sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      @media (prefers-reduced-motion: no-preference) {
        button {
          transition: filter 0.12s;
        }
      }
    </style>

    <main>
      <header>
        <h1>Password Generator</h1>
        <p class="lede">
          Random passwords built in your browser. Nothing is sent or stored.
        </p>
      </header>

      <section class="panel output" aria-label="Generated password">
        <div id="pw" class="pw" aria-live="polite"></div>
        <div class="actions">
          <button id="copy" class="primary" type="button">Copy password</button>
          <button id="regen" class="secondary" type="button">
            Generate new
          </button>
        </div>
        <div class="strength">
          <div class="strength-head">
            <span class="strength-label" id="sLabel">Strong</span>
            <span class="strength-meta" id="sMeta"></span>
          </div>
          <div class="bars" id="bars" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
        </div>
      </section>

      <section class="panel" aria-label="Password criteria">
        <fieldset>
          <div class="row">
            <label class="len-label" for="len">Length</label>
            <output class="len-value" id="lenOut" for="len">16</output>
          </div>
          <input id="len" type="range" min="8" max="64" value="16" step="1" />
        </fieldset>

        <hr class="divider" />

        <fieldset>
          <p class="group-title">Include</p>
          <div class="opts">
            <label class="opt" for="lower"
              ><input id="lower" type="checkbox" checked /><span class="t"
                ><span class="name">Lowercase</span
                ><span class="eg">a b c</span></span
              ></label
            >
            <label class="opt" for="upper"
              ><input id="upper" type="checkbox" checked /><span class="t"
                ><span class="name">Uppercase</span
                ><span class="eg">A B C</span></span
              ></label
            >
            <label class="opt" for="digits"
              ><input id="digits" type="checkbox" checked /><span class="t"
                ><span class="name">Numbers</span
                ><span class="eg">1 2 3</span></span
              ></label
            >
            <label class="opt" for="symbols"
              ><input id="symbols" type="checkbox" checked /><span class="t"
                ><span class="name">Symbols</span
                ><span class="eg">! @ # $ %</span></span
              ></label
            >
          </div>
        </fieldset>

        <hr class="divider" />

        <fieldset>
          <p class="group-title">Rules</p>
          <div class="opts">
            <label class="opt" for="ambig"
              ><input id="ambig" type="checkbox" /><span class="t"
                ><span class="name">Skip look-alikes</span
                ><span class="eg">0 O o 1 l I</span></span
              ></label
            >
            <label class="opt" for="startLetter"
              ><input id="startLetter" type="checkbox" /><span class="t"
                ><span class="name">Start with a letter</span
                ><span class="eg">for strict sites</span></span
              ></label
            >
          </div>
        </fieldset>
        <p class="note" style="margin-top: 16px">
          Every selected type appears at least once. At least one type must stay
          on.
        </p>
      </section>
    </main>

    <script>
      (function () {
        var SETS = {
          lower: "abcdefghijklmnopqrstuvwxyz",
          upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
          digits: "0123456789",
          symbols: "!@#$%^&*()-_=+?",
        };
        var AMBIGUOUS = /[0Oo1lI]/g;

        var $ = function (id) {
          return document.getElementById(id);
        };
        var els = {
          pw: $("pw"),
          copy: $("copy"),
          regen: $("regen"),
          len: $("len"),
          lenOut: $("lenOut"),
          lower: $("lower"),
          upper: $("upper"),
          digits: $("digits"),
          symbols: $("symbols"),
          ambig: $("ambig"),
          startLetter: $("startLetter"),
          sLabel: $("sLabel"),
          sMeta: $("sMeta"),
          bars: $("bars"),
        };
        var typeKeys = ["lower", "upper", "digits", "symbols"];
        var current = "";

        // Unbiased random integer in [0, max) using rejection sampling.
        function randInt(max) {
          var buf = new Uint32Array(1);
          var limit = Math.floor(4294967296 / max) * max;
          do {
            crypto.getRandomValues(buf);
          } while (buf[0] >= limit);
          return buf[0] % max;
        }
        function pick(str) {
          return str.charAt(randInt(str.length));
        }
        function shuffle(arr) {
          for (var i = arr.length - 1; i > 0; i--) {
            var j = randInt(i + 1);
            var t = arr[i];
            arr[i] = arr[j];
            arr[j] = t;
          }
          return arr;
        }

        function activeSets() {
          var noAmbig = els.ambig.checked;
          return typeKeys
            .filter(function (k) {
              return els[k].checked;
            })
            .map(function (k) {
              return noAmbig ? SETS[k].replace(AMBIGUOUS, "") : SETS[k];
            });
        }

        function generate() {
          var sets = activeSets();
          var len = parseInt(els.len.value, 10);
          var pool = sets.join("");
          var chars = sets.map(pick); // guarantee one from each selected type
          while (chars.length < len) chars.push(pick(pool));
          shuffle(chars);

          if (els.startLetter.checked) {
            var isLetter = function (c) {
              return /[A-Za-z]/.test(c);
            };
            if (!isLetter(chars[0])) {
              var idx = chars.findIndex(isLetter);
              if (idx > 0) {
                var t = chars[0];
                chars[0] = chars[idx];
                chars[idx] = t;
              }
            }
          }
          return { text: chars.join(""), poolSize: pool.length, length: len };
        }

        function render(result) {
          current = result.text;
          els.pw.textContent = "";
          for (var i = 0; i < current.length; i++) {
            var c = current.charAt(i);
            var span = document.createElement("span");
            if (/[0-9]/.test(c)) span.className = "d";
            else if (!/[A-Za-z]/.test(c)) span.className = "s";
            span.textContent = c;
            els.pw.appendChild(span);
          }
          var bits = Math.round(result.length * Math.log2(result.poolSize));
          var level = bits < 40 ? 1 : bits < 60 ? 2 : bits < 80 ? 3 : 4;
          var names = ["", "Weak", "Fair", "Good", "Strong"];
          var colors = [
            "",
            "var(--weak)",
            "var(--fair)",
            "var(--good)",
            "var(--strong)",
          ];
          els.sLabel.textContent = names[level];
          els.sMeta.textContent =
            bits +
            " bits · " +
            result.length +
            " characters · pool of " +
            result.poolSize;
          var spans = els.bars.children;
          for (var k = 0; k < spans.length; k++) {
            spans[k].className = k < level ? "on" : "";
            spans[k].style.setProperty("--level", colors[level]);
          }
        }

        function refresh() {
          els.lenOut.textContent = els.len.value;
          render(generate());
          save();
        }

        function save() {
          try {
            var s = {
              len: els.len.value,
              ambig: els.ambig.checked,
              startLetter: els.startLetter.checked,
            };
            typeKeys.forEach(function (k) {
              s[k] = els[k].checked;
            });
            localStorage.setItem("pwgen-settings", JSON.stringify(s));
          } catch (e) {}
        }
        function load() {
          try {
            var raw = localStorage.getItem("pwgen-settings");
            if (!raw) return;
            var s = JSON.parse(raw);
            if (s.len) els.len.value = s.len;
            ["ambig", "startLetter"].concat(typeKeys).forEach(function (k) {
              if (typeof s[k] === "boolean") els[k].checked = s[k];
            });
            if (
              !typeKeys.some(function (k) {
                return els[k].checked;
              })
            )
              els.lower.checked = true;
          } catch (e) {}
        }

        typeKeys.forEach(function (k) {
          els[k].addEventListener("change", function () {
            if (
              !typeKeys.some(function (x) {
                return els[x].checked;
              })
            )
              els[k].checked = true;
            refresh();
          });
        });
        els.len.addEventListener("input", refresh);
        els.ambig.addEventListener("change", refresh);
        els.startLetter.addEventListener("change", refresh);
        els.regen.addEventListener("click", function () {
          refresh();
        });

        var resetTimer;
        function flash(msg) {
          els.copy.textContent = msg;
          clearTimeout(resetTimer);
          resetTimer = setTimeout(function () {
            els.copy.textContent = "Copy password";
          }, 1600);
        }
        function selectText() {
          var r = document.createRange();
          r.selectNodeContents(els.pw);
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(r);
        }
        els.copy.addEventListener("click", function () {
          var done = function () {
            flash("Copied");
          };
          var fail = function () {
            selectText();
            flash("Press Ctrl+C to copy");
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(current).then(done, fail);
          } else {
            fail();
          }
        });

        load();
        refresh();
      })();
    </script>
  </body>
</html>
